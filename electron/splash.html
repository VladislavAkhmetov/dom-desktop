<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>dombro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-card {
      width: 340px;
      height: 210px;
      background: rgba(246, 250, 244, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 18px 44px rgba(38, 64, 49, 0.16), 0 2px 10px rgba(38, 64, 49, 0.06);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 22px 18px;
      color: #24382e;
      animation: splash-appear 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes splash-appear {
      from {
        opacity: 0;
        transform: scale(0.97);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-mark {
      font-size: 22px;
      line-height: 1;
      color: #2e5543;
      display: inline-block;
      animation: gentle-spin 12s linear infinite;
    }
    @keyframes gentle-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #1e3529;
    }
    .brand-dot {
      color: #4a8264;
    }
    .brand-sub {
      font-size: 12.5px;
      color: #5c7568;
      font-weight: 500;
    }
    .loader-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }
    .progress-track {
      width: 180px;
      height: 4px;
      background: rgba(60, 95, 75, 0.12);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #447a5e, #5ca07c);
      border-radius: 999px;
      animation: calm-pulse 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes calm-pulse {
      0% {
        left: -40%;
        width: 35%;
      }
      50% {
        width: 55%;
      }
      100% {
        left: 105%;
        width: 35%;
      }
    }
    .status-text {
      font-size: 11.5px;
      color: #6d8679;
      letter-spacing: 0.01em;
      font-weight: 500;
    }
    .footer-section {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #8da497;
      padding: 0 4px;
    }
    .badge {
      background: rgba(70, 110, 88, 0.09);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      color: #3b604e;
      font-size: 10.5px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="brand-section">
      <div class="brand-header">
        <span class="brand-mark">✳</span>
        <span class="brand-title">dombro<span class="brand-dot">.</span></span>
      </div>
      <div class="brand-sub">спокойный рабочий дашборд</div>
    </div>
    <div class="loader-section">
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div class="status-text">Запуск пространства...</div>
    </div>
    <div class="footer-section">
      <span class="badge">кабинеты</span>
      <span>v0.1.0</span>
    </div>
  </div>
</body>
</html>
