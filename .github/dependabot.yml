# Chromium arrives with Electron: Dependabot opens a weekly PR for new Electron
# releases (security patches included); CI must be green before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      electron:
        patterns: ['electron', 'electron-builder', 'electron-updater']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      build-tools:
        patterns: ['vite', 'vitest', '@vitejs/*', 'typescript']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
